name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode GPG Secret Key Ring File
        run: |
          echo "${{ secrets.SIGNING_SECRET_KEY_RING_FILE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/secret.gpg

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to Maven Central
        run: |
          ./gradlew :date-time-kit:publishAllPublicationsToMavenCentralRepository --no-daemon \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            -Psigning.secretKeyRingFile="${{ github.workspace }}/secret.gpg" \
            -PmavenCentralUsername="${{ secrets.MAVENCENTRAL_USERNAME }}" \
            -PmavenCentralPassword="${{ secrets.MAVENCENTRAL_PASSWORD }}"
